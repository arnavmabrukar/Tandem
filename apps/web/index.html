<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3954" />
    <meta
      name="description"
      content="Tandem's human dashboard for coordinating independent coding agents."
    />
    <link rel="icon" type="image/svg+xml" href="./tandem.svg" />
    <script>
      // Pick the theme before first paint so a dark choice never flashes light.
      try {
        var saved = localStorage.getItem('tandem-theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>Tandem — Coordination dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
